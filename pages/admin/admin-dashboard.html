<!DOCTYPE html>
<html lang="en">
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <h1>♻ Smart Waste – Admin</h1>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<!-- DASHBOARD CARDS -->
<section class="cards">
  <div class="dash-card">
    <h3>📦 Total Complaints</h3>
    <p id="totalComplaints">0</p>
  </div>

  <div class="dash-card">
    <h3>⏳ Pending</h3>
    <p id="pendingCount">0</p>
  </div>

  <div class="dash-card">
    <h3>✅ Completed</h3>
    <p id="completedCount">0</p>
  </div>
</section>

<!-- COMPLAINT TABLE -->
<section class="card1">
  <h2>📋 All Complaints</h2>
  <table>
    <thead>
      <tr>
        <th>Location</th>
        <th>Description</th>
        <th>Status</th>
        <th>Update</th>
      </tr>
    </thead>
    <tbody id="complaintsTable"></tbody>
  </table>
</section>

<!-- NOTIFICATIONS -->
<section class="card1">
  <h2>🔔 System Notifications</h2>
  <ul id="adminNotifications"></ul>
</section>

<script type="module" src="../../js/admin.js"></script>
</body>
</html>
