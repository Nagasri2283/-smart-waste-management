<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login | Smart Waste</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

<header class="header">
  <h1>♻️ Smart Waste Management</h1>
</header>

<section class="login-container">

  <div class="card admin-card">
    <h2>🔐 Admin Login</h2>

    <input type="email" id="adminEmail" placeholder="Admin Email">
    <input type="password" id="adminPassword" placeholder="Password">

    <button class="btn admin-btn" onclick="loginAdmin()">Login</button>

    <p class="link-text">
      New Admin? <a href="admin-register.html">Register here</a>
    </p>
  </div>

</section>

<script type="module" src="../../js/admin-auth.js"></script>
</body>
</html>
