<body>

<!-- NAVBAR -->

<!-- REPORT CARD -->
<div class="report-card">

  <h2>📸 Report Overflowing Bin</h2>
  <p class="subtitle">Help keep the city clean by reporting waste issues</p>

  <div class="form-group">
    <label>📍 Waste Location</label>
    <input type="text" id="location" placeholder="Enter waste location">
  </div>

  <div class="form-group">
    <label>📝 Description</label>
    <textarea id="description" placeholder="Describe the issue"></textarea>
  </div>

  <div class="form-group">
    <label>🖼 Upload Image</label>
    <input type="file" id="image" accept="image/*">
    <img id="preview" style="display:none; width:100%; margin-top:12px; border-radius:12px;">
  </div>

  <button id="submitBtn">🚀 Submit Complaint</button>

</div>
<!-- FIREBASE + LOGIC -->
<script type="module">
  import { getAuth, onAuthStateChanged } 
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  import { collection, addDoc } 
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  import { db } from "../js/firebase.js";

  /* AUTH PROTECTION */
  const auth = getAuth();
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    }
  });

  /* IMAGE PREVIEW */
  document.getElementById("image").addEventListener("change", (e) => {
    const preview = document.getElementById("preview");
    preview.src = URL.createObjectURL(e.target.files[0]);
    preview.style.display = "block";
  });

  /* SUBMIT COMPLAINT */
  document.getElementById("submitBtn").onclick = async () => {
    const location = document.getElementById("location").value.trim();
    const description = document.getElementById("description").value.trim();

</script>

</body>
</html>
