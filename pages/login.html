<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Smart Waste Management</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header class="header">
  <h1>♻️ Smart Waste Management</h1>
</header>

<section class="login-container">

  <!-- User Login -->
  <div class="card user-card">
    <h2>👤 User Login</h2>

    <input type="email" id="userEmail" placeholder="User Email">
    <input type="password" id="userPassword" placeholder="Password">

    <button class="btn user-btn" onclick="loginUser()">Login</button>

    <p class="link-text">
      New User? <a href="register.html">Register</a>
    </p>
  </div>

  <!-- Admin Login -->
  <div class="card admin-card">
    <h2>👑 Admin Login</h2>

    <input type="email" id="adminEmail" placeholder="Admin Email">
    <input type="password" id="adminPassword" placeholder="Password">

    <button class="btn admin-btn" onclick="loginAdmin()">Login</button>

    <p class="link-text">
      New Admin? <a href="admin/admin-register.html">Register</a>
    </p>
  </div>
</section>
<script src="../js/firebase.js"></script>
<script src="../js/common-login.js"></script>
<script src="../js/admin-auth.js"></script>
</body>
</html>
