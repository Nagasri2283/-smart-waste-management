<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Waste Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1>♻️ Smart Waste Management</h1>
  </header>

  <!-- Login Section -->
  <section class="login-container">

    <!-- User Login -->
    <div class="card user-card">
      <h2>👤 User Login</h2>

      <input type="email" placeholder="User Email">
      <input type="password" placeholder="Password">

      <button class="btn user-btn">Login</button>

      <p class="link-text">
        New User? <a href="#">Register</a>
      </p>
    </div>

    <!-- Admin Login -->
    <div class="card admin-card">
      <h2>👑 Admin Login</h2>

      <input type="email" placeholder="Admin Email">
      <input type="password" placeholder="Password">

      <button class="btn admin-btn">Login</button>

      <p class="link-text">
        New Admin? <a href="#">Register</a>
      </p>
    </div>

  </section>

</body>
</html>
